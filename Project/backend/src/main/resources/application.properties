spring.application.name=backend
# 로컬에서 gradlew로 직접 실행할 때도 docker-compose용 루트 .env를 그대로 재사용하기 위한 설정.
# .env는 KEY=VALUE 줄바꿈 형식이라 자바 properties 문법과 동일해서 그대로 읽힌다.
# 파일이 없으면(운영 배포 등 환경변수를 이미 OS에 주입하는 환경) 조용히 건너뛴다.
spring.config.import=optional:file:../.env
# DB 연결 (환경변수 미설정 시 로컬 개발용 기본값 사용)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/roomie_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:aki}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 설정 (스키마 변경은 자동 반영하지 않음 - 테이블 수정은 직접 MySQL로 진행)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 서버 포트
server.port=${SERVER_PORT:8080}

# 프로필 이미지 업로드
file.upload-dir=${UPLOAD_DIR:uploads/profile}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# CORS 허용 origin (콤마로 여러 개 가능)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174}

# 소셜 로그인 성공 후 리다이렉트할 프론트엔드 주소
app.frontend-url=${FRONTEND_URL:http://localhost:5174}

# JWT (운영 배포 시 JWT_SECRET 환경변수로 반드시 교체)
jwt.secret=${JWT_SECRET:roomie-dev-secret-key-please-replace-in-production-32bytes+}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== 카카오 소셜 로그인 =====
# client-id: 카카오 개발자 콘솔의 "REST API 키"
# client-secret: 콘솔에서 "Client Secret"을 별도로 발급/활성화 안 했다면, 실제로 검증하지 않으니 임의의 값이어도 동작함
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:not-used}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,profile_image,account_email
spring.security.oauth2.client.registration.kakao.client-name=Kakao

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# ===== 이메일 인증 (Gmail SMTP) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
# 인증번호 유효 시간 (분)
email.verification.expire-minutes=5