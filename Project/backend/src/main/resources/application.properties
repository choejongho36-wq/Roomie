spring.application.name=backend
# DB 연결 (환경변수 미설정 시 로컬 개발용 기본값 사용)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/roomie_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:aki}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 설정 (스키마 변경은 자동 반영하지 않음 - 테이블 수정은 직접 MySQL로 진행)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 서버 포트
server.port=${SERVER_PORT:8080}

# 프로필 이미지 업로드
file.upload-dir=${UPLOAD_DIR:uploads/profile}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# CORS 허용 origin (콤마로 여러 개 가능)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174}

# JWT (운영 배포 시 JWT_SECRET 환경변수로 반드시 교체)
jwt.secret=${JWT_SECRET:roomie-dev-secret-key-please-replace-in-production-32bytes+}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}