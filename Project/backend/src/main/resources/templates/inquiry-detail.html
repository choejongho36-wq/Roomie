<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>문의 상세 - Roomie Admin</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
        <link th:href="@{/startbootstrap-sb-admin-gh-pages/css/styles.css}" rel="stylesheet" />
        <link th:href="@{/admin-custom.css}" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    </head>
    <body class="sb-nav-fixed">
        <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
            <a class="navbar-brand ps-3 admin-brand" th:href="@{/admin}">
                <img th:src="@{/images/roomie-logo.png}" alt="Roomie" class="admin-brand-logo" />
                <span class="admin-brand-text">Roomie<span class="admin-brand-sub">Admin</span></span>
            </a>
            <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle" href="#!"><i class="fas fa-bars"></i></button>
            <ul class="navbar-nav ms-auto ms-md-0 me-3 me-lg-4">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false"><i class="fas fa-user fa-fw"></i></a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" th:href="@{/admin/logout}">Logout</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
        <div id="layoutSidenav">
            <div id="layoutSidenav_nav">
                <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
                    <div class="sb-sidenav-menu">
                        <div class="nav">
                            <div class="sb-sidenav-menu-heading">Core</div>
                            <a class="nav-link" th:href="@{/admin}">
                                <div class="sb-nav-link-icon"><i class="fas fa-tachometer-alt"></i></div>
                                Dashboard
                            </a>
                            <div class="sb-sidenav-menu-heading">관리</div>
                            <a class="nav-link" th:href="@{/admin/users}">
                                <div class="sb-nav-link-icon"><i class="fas fa-users"></i></div>
                                회원 관리
                            </a>
                            <a class="nav-link" th:href="@{/admin/posts}">
                                <div class="sb-nav-link-icon"><i class="fas fa-file-alt"></i></div>
                                게시글 관리
                            </a>
                            <a class="nav-link active" th:href="@{/admin/inquiries}">
                                <div class="sb-nav-link-icon"><i class="fas fa-envelope-open-text"></i></div>
                                문의 관리
                            </a>
                        </div>
                    </div>
                    <div class="sb-sidenav-footer">
                        <div class="small">Logged in as:</div>
                        관리자
                    </div>
                </nav>
            </div>
            <div id="layoutSidenav_content">
                <main>
                    <div class="container-fluid px-4">
                        <h1 class="mt-4">문의 상세</h1>
                        <ol class="breadcrumb mb-4">
                            <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                            <li class="breadcrumb-item"><a th:href="@{/admin/inquiries}">문의 관리</a></li>
                            <li class="breadcrumb-item active" th:text="${inquiry.title}">제목</li>
                        </ol>
                        <div class="card mb-4">
                            <div class="card-header">
                                <span th:text="${inquiry.category}">분류</span> ·
                                <span th:text="${authorName} ?: '알 수 없음'">작성자</span> ·
                                <span th:text="${#temporals.format(inquiry.createdAt, 'yyyy-MM-dd HH:mm')}">작성일</span>
                            </div>
                            <div class="card-body">
                                <h5 th:text="${inquiry.title}">제목</h5>
                                <p style="white-space: pre-wrap;" th:text="${inquiry.content}">내용</p>
                            </div>
                        </div>
                        <div class="card mb-4">
                            <div class="card-header">관리자 답변</div>
                            <div class="card-body">
                                <div th:if="${inquiry.status == 'ANSWERED'}" class="mb-3">
                                    <div class="alert alert-light border">
                                        <div class="small text-muted mb-1" th:text="${#temporals.format(inquiry.answeredAt, 'yyyy-MM-dd HH:mm')} + ' 답변'">답변일</div>
                                        <div style="white-space: pre-wrap;" th:text="${inquiry.answer}">답변 내용</div>
                                    </div>
                                </div>
                                <form th:action="@{'/admin/inquiries/' + ${inquiry.inquiryId} + '/answer'}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <div class="mb-3">
                                        <textarea class="form-control" name="answer" rows="5" placeholder="답변을 입력하세요" required th:text="${inquiry.answer}"></textarea>
                                    </div>
                                    <button type="submit" class="btn btn-primary" th:text="${inquiry.status == 'ANSWERED'} ? '답변 수정' : '답변 등록'">답변 등록</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </main>
                <footer class="py-4 bg-light mt-auto">
                    <div class="container-fluid px-4">
                        <div class="d-flex align-items-center justify-content-between small">
                            <div class="text-muted">Copyright &copy; Roomie</div>
                        </div>
                    </div>
                </footer>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script th:src="@{/startbootstrap-sb-admin-gh-pages/js/scripts.js}"></script>
    </body>
</html>
