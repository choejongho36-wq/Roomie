<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>게시글 관리 - Roomie Admin</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
        <link th:href="@{/startbootstrap-sb-admin-gh-pages/css/styles.css}" rel="stylesheet" />
        <link th:href="@{/admin-custom.css}" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    </head>
    <body class="sb-nav-fixed">
        <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
            <a class="navbar-brand ps-3 admin-brand" th:href="@{/admin}">
                <img th:src="@{/images/roomie-logo.png}" alt="Roomie" class="admin-brand-logo" />
                <span class="admin-brand-text">Roomie<span class="admin-brand-sub">Admin</span></span>
            </a>
            <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle" href="#!"><i class="fas fa-bars"></i></button>
            <div class="d-none d-md-inline-block ms-auto me-0 me-md-3 my-2 my-md-0 admin-search-wrap">
                <div class="input-group">
                    <input class="form-control" type="text" id="adminSearchInput" placeholder="기능 검색 (예: 회원, 공지)" aria-label="기능 검색" aria-describedby="btnNavbarSearch" autocomplete="off" />
                    <button class="btn btn-primary" id="btnNavbarSearch" type="button"><i class="fas fa-search"></i></button>
                </div>
                <div id="adminSearchResults" class="admin-search-results"></div>
            </div>
            <ul class="navbar-nav ms-auto ms-md-0 me-3 me-lg-4">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false"><i class="fas fa-user fa-fw"></i></a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" href="http://localhost:5174" target="_blank" rel="noopener">Roomie</a></li>
                        <li><hr class="dropdown-divider" /></li>
                        <li><a class="dropdown-item" th:href="@{/admin/logout}">Logout</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
        <div id="layoutSidenav">
            <div id="layoutSidenav_nav">
                <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
                    <div class="sb-sidenav-menu">
                        <div class="nav">
                            <div class="sb-sidenav-menu-heading">Core</div>
                            <a class="nav-link" th:href="@{/admin}">
                                <div class="sb-nav-link-icon"><i class="fas fa-tachometer-alt"></i></div>
                                Dashboard
                            </a>
                            <div class="sb-sidenav-menu-heading">관리</div>
                            <a class="nav-link" th:href="@{/admin/users}">
                                <div class="sb-nav-link-icon"><i class="fas fa-users"></i></div>
                                회원 관리
                            </a>
                            <a class="nav-link active" th:href="@{/admin/posts}">
                                <div class="sb-nav-link-icon"><i class="fas fa-file-alt"></i></div>
                                게시글 관리
                            </a>
                            <a class="nav-link" th:href="@{/admin/inquiries}">
                                <div class="sb-nav-link-icon"><i class="fas fa-envelope-open-text"></i></div>
                                문의 관리
                            </a>
                            <a class="nav-link" th:href="@{/admin/notices}">
                                <div class="sb-nav-link-icon"><i class="fas fa-bullhorn"></i></div>
                                공지/이벤트 관리
                            </a>
                        </div>
                    </div>
                    <div class="sb-sidenav-footer">
                        <div class="small">Logged in as:</div>
                        <span th:text="${adminNickname}">관리자</span>
                    </div>
                </nav>
            </div>
            <div id="layoutSidenav_content">
                <main>
                    <div class="container-fluid px-4">
                        <h1 class="mt-4">게시글 관리</h1>
                        <ol class="breadcrumb mb-4">
                            <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                            <li class="breadcrumb-item active">게시글 관리</li>
                        </ol>
                        <div class="card mb-4">
                            <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
                                <span>
                                    <i class="fas fa-file-alt me-1"></i>
                                    전체 게시글 (<span th:text="${postsPage.totalElements}">0</span>건)
                                </span>
                                <form th:action="@{/admin/posts}" method="get" class="mb-0">
                                    <input type="hidden" name="sort" th:value="${sort}" />
                                    <input type="hidden" name="dir" th:value="${dir}" />
                                    <div class="input-group input-group-sm" style="max-width: 320px;">
                                        <input type="text" name="keyword" class="form-control" placeholder="제목 또는 작성자 검색" th:value="${keyword}" />
                                        <button type="submit" class="btn btn-outline-secondary">검색</button>
                                        <a th:if="${!#strings.isEmpty(keyword)}" th:href="@{/admin/posts}" class="btn btn-outline-secondary">초기화</a>
                                    </div>
                                </form>
                            </div>
                            <div class="card-body">
                                <table class="table table-striped table-hover align-middle">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>게시판</th>
                                            <th>제목</th>
                                            <th>작성자</th>
                                            <th>
                                                <a class="text-decoration-none text-dark"
                                                   th:href="@{/admin/posts(page=0, keyword=${keyword}, sort='reported', dir=${sort == 'reported' && dir == 'desc' ? 'asc' : 'desc'})}">
                                                    상태
                                                    <i th:if="${sort == 'reported' && dir == 'desc'}" class="fas fa-sort-down"></i>
                                                    <i th:if="${sort == 'reported' && dir == 'asc'}" class="fas fa-sort-up"></i>
                                                    <i th:if="${sort != 'reported'}" class="fas fa-sort text-muted"></i>
                                                </a>
                                            </th>
                                            <th>
                                                <a class="text-decoration-none text-dark"
                                                   th:href="@{/admin/posts(page=0, keyword=${keyword}, sort='createdAt', dir=${sort == 'createdAt' && dir == 'desc' ? 'asc' : 'desc'})}">
                                                    작성일
                                                    <i th:if="${sort == 'createdAt' && dir == 'desc'}" class="fas fa-sort-down"></i>
                                                    <i th:if="${sort == 'createdAt' && dir == 'asc'}" class="fas fa-sort-up"></i>
                                                    <i th:if="${sort != 'createdAt'}" class="fas fa-sort text-muted"></i>
                                                </a>
                                            </th>
                                            <th>관리</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="p : ${postsPage.content}">
                                            <td th:text="${p.postId}">1</td>
                                            <td th:text="${p.boardType}">자유 게시판</td>
                                            <td th:text="${p.title}">제목</td>
                                            <td th:text="${authorNames.get(p.userId)} ?: '알 수 없음'">닉네임</td>
                                            <td>
                                                <span class="badge bg-secondary" th:if="${reportCounts.get(p.postId) == null or reportCounts.get(p.postId) == 0}">정상</span>
                                                <span class="badge bg-danger" th:if="${reportCounts.get(p.postId) != null and reportCounts.get(p.postId) > 0}"
                                                      th:text="'신고 ' + ${reportCounts.get(p.postId)} + '건'">신고 1건</span>
                                            </td>
                                            <td th:text="${#temporals.format(p.createdAt, 'yyyy-MM-dd')}">2026-01-01</td>
                                            <td>
                                                <form th:action="@{'/admin/posts/' + ${p.postId} + '/delete'}" method="post" class="d-inline">
                                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('게시글과 댓글이 모두 삭제됩니다. 계속할까요?');">삭제</button>
                                                </form>
                                            </td>
                                        </tr>
                                        <tr th:if="${postsPage.empty}">
                                            <td colspan="7" class="text-center text-muted">검색 결과가 없습니다.</td>
                                        </tr>
                                    </tbody>
                                </table>
                                <nav th:if="${postsPage.totalPages > 1}">
                                    <ul class="pagination">
                                        <li class="page-item" th:each="i : ${#numbers.sequence(0, postsPage.totalPages - 1)}"
                                            th:classappend="${i == postsPage.number} ? 'active'">
                                            <a class="page-link" th:href="@{/admin/posts(page=${i}, keyword=${keyword}, sort=${sort}, dir=${dir})}" th:text="${i + 1}">1</a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                    </div>
                </main>
                <footer class="py-4 bg-light mt-auto">
                    <div class="container-fluid px-4">
                        <div class="d-flex align-items-center justify-content-between small">
                            <div class="text-muted">Copyright &copy; Roomie</div>
                        </div>
                    </div>
                </footer>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script th:src="@{/startbootstrap-sb-admin-gh-pages/js/scripts.js}"></script>
        <script th:src="@{/admin-search.js}"></script>
    </body>
</html>
