<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>관리자 로그인 - Roomie</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
        <link th:href="@{/startbootstrap-sb-admin-gh-pages/css/styles.css}" rel="stylesheet" />
        <link th:href="@{/admin-custom.css}" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    </head>
    <body class="admin-login-bg">
        <div class="admin-login-wrap">
            <div class="admin-login-card">
                <img th:src="@{/images/roomie-logo.png}" alt="Roomie" class="admin-login-logo" />
                <h1 class="admin-login-title">Roomie<span>Admin</span></h1>
                <p class="admin-login-subtitle">관리자 계정으로 로그인하세요</p>

                <div class="alert alert-danger py-2" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</div>
                <div class="alert alert-success py-2" th:if="${param.logout}">로그아웃되었습니다.</div>

                <form th:action="@{/admin/login}" method="post" class="admin-login-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <div class="form-floating mb-3">
                        <input class="form-control" id="inputLoginId" name="loginId" type="text" placeholder="아이디" required />
                        <label for="inputLoginId">아이디</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input class="form-control" id="inputPassword" name="password" type="password" placeholder="Password" required />
                        <label for="inputPassword">비밀번호</label>
                    </div>
                    <button class="btn admin-login-btn w-100" type="submit">로그인</button>
                </form>
            </div>
            <p class="admin-login-footer">&copy; Roomie</p>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script th:src="@{/startbootstrap-sb-admin-gh-pages/js/scripts.js}"></script>
    </body>
</html>
