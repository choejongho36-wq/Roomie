<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>게시글 고정 관리 - Roomie Admin</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
        <link th:href="@{/startbootstrap-sb-admin-gh-pages/css/styles.css}" rel="stylesheet" />
        <link th:href="@{/admin-custom.css}" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    </head>
    <body class="sb-nav-fixed">
        <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
            <a class="navbar-brand ps-3 admin-brand" th:href="@{/admin}">
                <img th:src="@{/images/roomie-logo.png}" alt="Roomie" class="admin-brand-logo" />
                <span class="admin-brand-text">Roomie<span class="admin-brand-sub">Admin</span></span>
            </a>
            <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle" href="#!"><i class="fas fa-bars"></i></button>
            <div class="d-none d-md-inline-block ms-auto me-0 me-md-3 my-2 my-md-0 admin-search-wrap">
                <div class="input-group">
                    <input class="form-control" type="text" id="adminSearchInput" placeholder="기능 검색 (예: 회원, 공지)" aria-label="기능 검색" aria-describedby="btnNavbarSearch" autocomplete="off" />
                    <button class="btn btn-primary" id="btnNavbarSearch" type="button"><i class="fas fa-search"></i></button>
                </div>
                <div id="adminSearchResults" class="admin-search-results"></div>
            </div>
            <ul class="navbar-nav ms-auto ms-md-0 me-3 me-lg-4">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false"><i class="fas fa-user fa-fw"></i></a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" th:href="@{/admin/logout}">Logout</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
        <div id="layoutSidenav">
            <div id="layoutSidenav_nav">
                <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
                    <div class="sb-sidenav-menu">
                        <div class="nav">
                            <div class="sb-sidenav-menu-heading">Core</div>
                            <a class="nav-link" th:href="@{/admin}">
                                <div class="sb-nav-link-icon"><i class="fas fa-tachometer-alt"></i></div>
                                Dashboard
                            </a>
                            <div class="sb-sidenav-menu-heading">관리</div>
                            <a class="nav-link" th:href="@{/admin/users}">
                                <div class="sb-nav-link-icon"><i class="fas fa-users"></i></div>
                                회원 관리
                            </a>
                            <a class="nav-link" th:href="@{/admin/posts}">
                                <div class="sb-nav-link-icon"><i class="fas fa-file-alt"></i></div>
                                게시글 관리
                            </a>
                            <a class="nav-link" th:href="@{/admin/inquiries}">
                                <div class="sb-nav-link-icon"><i class="fas fa-envelope-open-text"></i></div>
                                문의 관리
                            </a>
                            <a class="nav-link active" th:href="@{/admin/notices}">
                                <div class="sb-nav-link-icon"><i class="fas fa-bullhorn"></i></div>
                                게시글 고정 관리
                            </a>
                        </div>
                    </div>
                    <div class="sb-sidenav-footer">
                        <div class="small">Logged in as:</div>
                        <span th:text="${adminNickname}">관리자</span>
                    </div>
                </nav>
            </div>
            <div id="layoutSidenav_content">
                <main>
                    <div class="container-fluid px-4">
                        <h1 class="mt-4">게시글 고정 관리</h1>
                        <ol class="breadcrumb mb-4">
                            <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                            <li class="breadcrumb-item active">게시글 고정 관리</li>
                        </ol>

                        <!-- 게시판 목록. 공지사항/이벤트(관리자가 직접 쓰는 공지성 게시판)와 커뮤니티
                             게시판(회원이 쓰는 자유게시판 카테고리)을 구분해서 보여준다. "전체"는
                             커뮤니티 게시판들만의 전체이고, 공지사항/이벤트는 포함하지 않는다 —
                             공지사항/이벤트는 각각 따로 선택해서 본다. -->
                        <div class="mb-3">
                            <div class="text-muted small mb-1">공지 · 이벤트</div>
                            <div class="d-flex flex-wrap gap-2 mb-3">
                                <a th:each="board : ${noticeBoardTypes}"
                                   th:href="@{/admin/notices(type=${board})}"
                                   th:classappend="${type == board} ? 'btn-roomie-warning' : 'btn-outline-secondary'"
                                   class="btn btn-sm" th:text="${board}">게시판</a>
                            </div>
                            <div class="text-muted small mb-1">커뮤니티</div>
                            <div class="d-flex flex-wrap gap-2">
                                <a th:href="@{/admin/notices}"
                                   th:classappend="${#strings.isEmpty(type)} ? 'btn-roomie-warning' : 'btn-outline-secondary'"
                                   class="btn btn-sm">전체</a>
                                <a th:each="board : ${communityBoardTypes}"
                                   th:href="@{/admin/notices(type=${board})}"
                                   th:classappend="${type == board} ? 'btn-roomie-warning' : 'btn-outline-secondary'"
                                   class="btn btn-sm" th:text="${board}">게시판</a>
                            </div>
                        </div>

                        <div class="card mb-4">
                            <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
                                <span class="fw-bold" th:text="${#strings.isEmpty(type)} ? '커뮤니티 전체 게시글' : (${type} + ' 게시글')">게시글</span>
                                <!-- 공지사항/이벤트는 관리자가 직접 작성하는 글이라 글쓰기 버튼을 두고,
                                     커뮤니티 게시판(고민상담/잡담/정보공유/생활 꿀팁)은 회원이 작성하는
                                     글이라 여기서는 고정/순서 관리만 하고 글쓰기 버튼은 두지 않는다. -->
                                <a th:if="${type == '공지사항' or type == '이벤트'}"
                                   th:href="@{/admin/notices/write(type=${type})}" class="btn btn-sm btn-primary">
                                    <i class="fas fa-pen me-1"></i>새 글쓰기
                                </a>
                            </div>
                            <div class="card-body p-0">
                                <table class="table table-striped table-hover align-middle mb-0">
                                    <thead>
                                        <tr>
                                            <th style="min-width: 190px;">고정</th>
                                            <th>ID</th>
                                            <th>게시판</th>
                                            <th>제목</th>
                                            <th>작성자</th>
                                            <th>작성일</th>
                                            <th>관리</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="n : ${notices}"
                                            th:classappend="${highlightedPostIds.contains(n.postId)} ? 'table-warning'">
                                            <td>
                                                <div class="d-flex align-items-center gap-1 flex-wrap">
                                                    <!-- 지금 보고 있는 스코프(pinScope: 특정 게시판, 또는 "전체")에 고정된 글일 때만
                                                         순서(▲▼) 버튼을 보여준다. -->
                                                    <form th:action="@{'/admin/notices/' + ${n.postId} + '/pin-order'}" method="post" class="d-inline"
                                                          th:if="${currentBoardPinOrder.get(n.postId) != null}">
                                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                        <input type="hidden" name="direction" value="up" />
                                                        <input type="hidden" name="boardType" th:value="${pinScope}" />
                                                        <input type="hidden" name="type" th:value="${type}" />
                                                        <button type="submit" class="btn btn-sm btn-outline-secondary px-2" title="위로">▲</button>
                                                    </form>
                                                    <form th:action="@{'/admin/notices/' + ${n.postId} + '/pin-order'}" method="post" class="d-inline"
                                                          th:if="${currentBoardPinOrder.get(n.postId) != null}">
                                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                        <input type="hidden" name="direction" value="down" />
                                                        <input type="hidden" name="boardType" th:value="${pinScope}" />
                                                        <input type="hidden" name="type" th:value="${type}" />
                                                        <button type="submit" class="btn btn-sm btn-outline-secondary px-2" title="아래로">▼</button>
                                                    </form>

                                                    <!-- 어느 게시판(들)에 고정할지 체크박스로 다중 선택. 중복 선택(여러 게시판에
                                                         동시에 고정) 허용. -->
                                                    <div class="dropdown">
                                                        <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button"
                                                                data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                                                            고정
                                                        </button>
                                                        <form class="dropdown-menu p-3" style="min-width: 180px;"
                                                              th:action="@{'/admin/notices/' + ${n.postId} + '/pin'}" method="post">
                                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                            <input type="hidden" name="type" th:value="${type}" />
                                                            <div class="form-check" th:each="board : ${pinnableBoardTypes}">
                                                                <input class="form-check-input" type="checkbox" name="boardTypes" th:value="${board}"
                                                                       th:id="${'pin-' + n.postId + '-' + board}"
                                                                       th:checked="${pinnedBoardsByPost.get(n.postId) != null and pinnedBoardsByPost.get(n.postId).contains(board)}" />
                                                                <label class="form-check-label" th:for="${'pin-' + n.postId + '-' + board}" th:text="${board}"></label>
                                                            </div>
                                                            <button type="submit" class="btn btn-sm btn-primary w-100 mt-2">적용</button>
                                                        </form>
                                                    </div>
                                                </div>
                                                <!-- 지금 고정돼 있는 게시판들을 배지로 표시. -->
                                                <div class="mt-1" th:if="${pinnedBoardsByPost.get(n.postId) != null and !pinnedBoardsByPost.get(n.postId).isEmpty()}">
                                                    <span class="badge bg-warning text-dark me-1"
                                                          th:each="pin : ${pinsByPost.get(n.postId)}" th:text="${pin.boardType}">공지사항</span>
                                                </div>
                                            </td>
                                            <td th:text="${n.postId}">1</td>
                                            <td th:text="${n.boardType}">공지사항</td>
                                            <td th:text="${n.title}">제목</td>
                                            <td th:text="${authorNames.get(n.userId)} ?: '알 수 없음'">닉네임</td>
                                            <td th:text="${#temporals.format(n.createdAt, 'yyyy-MM-dd')}">2026-01-01</td>
                                            <td>
                                                <!-- 수정 폼(notice-write.html)의 게시판 선택란은 공지사항/이벤트만 있어서,
                                                     커뮤니티 게시글(고민상담 등)에 열면 게시판이 실수로 바뀔 수 있다.
                                                     그래서 수정은 공지사항/이벤트 글에만 노출하고, 커뮤니티 글은
                                                     여기서는 고정/순서/삭제만 관리한다(내용 수정은 작성자 본인만 가능). -->
                                                <a th:if="${n.boardType == '공지사항' or n.boardType == '이벤트'}"
                                                   class="btn btn-sm btn-roomie-warning me-1" th:href="@{'/admin/notices/' + ${n.postId} + '/edit'}">수정</a>
                                                <form th:action="@{'/admin/notices/' + ${n.postId} + '/delete'}" method="post" class="d-inline">
                                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('삭제할까요?');">삭제</button>
                                                </form>
                                            </td>
                                        </tr>
                                        <tr th:if="${notices.isEmpty()}">
                                            <td colspan="7" class="text-center text-muted">등록된 게시글이 없습니다.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </main>
                <footer class="py-4 bg-light mt-auto">
                    <div class="container-fluid px-4">
                        <div class="d-flex align-items-center justify-content-between small">
                            <div class="text-muted">Copyright &copy; Roomie</div>
                        </div>
                    </div>
                </footer>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script th:src="@{/startbootstrap-sb-admin-gh-pages/js/scripts.js}"></script>
        <script th:src="@{/admin-search.js}"></script>
    </body>
</html>
