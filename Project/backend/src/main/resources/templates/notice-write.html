<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>새 글쓰기 - 게시글 관리 - Roomie Admin</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
        <link th:href="@{/startbootstrap-sb-admin-gh-pages/css/styles.css}" rel="stylesheet" />
        <link th:href="@{/admin-custom.css}" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    </head>
    <body class="sb-nav-fixed">
        <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
            <a class="navbar-brand ps-3 admin-brand" th:href="@{/admin}">
                <img th:src="@{/images/roomie-logo.png}" alt="Roomie" class="admin-brand-logo" />
                <span class="admin-brand-text">Roomie<span class="admin-brand-sub">Admin</span></span>
            </a>
            <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle" href="#!"><i class="fas fa-bars"></i></button>
            <div class="d-none d-md-inline-block ms-auto me-0 me-md-3 my-2 my-md-0 admin-search-wrap">
                <div class="input-group">
                    <input class="form-control" type="text" id="adminSearchInput" placeholder="기능 검색 (예: 회원, 공지)" aria-label="기능 검색" aria-describedby="btnNavbarSearch" autocomplete="off" />
                    <button class="btn btn-primary" id="btnNavbarSearch" type="button"><i class="fas fa-search"></i></button>
                </div>
                <div id="adminSearchResults" class="admin-search-results"></div>
            </div>
            <ul class="navbar-nav ms-auto ms-md-0 me-3 me-lg-4">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false"><i class="fas fa-user fa-fw"></i></a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" th:href="@{/admin/logout}">Logout</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
        <div id="layoutSidenav">
            <div id="layoutSidenav_nav">
                <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
                    <div class="sb-sidenav-menu">
                        <div class="nav">
                            <div class="sb-sidenav-menu-heading">Core</div>
                            <a class="nav-link" th:href="@{/admin}">
                                <div class="sb-nav-link-icon"><i class="fas fa-tachometer-alt"></i></div>
                                Dashboard
                            </a>
                            <div class="sb-sidenav-menu-heading">관리</div>
                            <a class="nav-link" th:href="@{/admin/users}">
                                <div class="sb-nav-link-icon"><i class="fas fa-users"></i></div>
                                회원 관리
                            </a>
                            <a class="nav-link active" th:href="@{/admin/posts}">
                                <div class="sb-nav-link-icon"><i class="fas fa-file-alt"></i></div>
                                게시글 관리
                            </a>
                            <a class="nav-link" th:href="@{/admin/inquiries}">
                                <div class="sb-nav-link-icon"><i class="fas fa-envelope-open-text"></i></div>
                                문의 관리
                            </a>
                            <a class="nav-link" th:href="@{/admin/notices}">
                                <div class="sb-nav-link-icon"><i class="fas fa-bullhorn"></i></div>
                                게시글 고정 관리
                            </a>
                        </div>
                    </div>
                    <div class="sb-sidenav-footer">
                        <div class="small">Logged in as:</div>
                        <span th:text="${adminNickname}">관리자</span>
                    </div>
                </nav>
            </div>
            <div id="layoutSidenav_content">
                <main>
                    <div class="container-fluid px-4">
                        <h1 class="mt-4" th:text="${notice != null} ? '공지/이벤트 수정' : '새 글쓰기'">새 글쓰기</h1>
                        <ol class="breadcrumb mb-4">
                            <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                            <li class="breadcrumb-item"><a th:href="@{/admin/posts}">게시글 관리</a></li>
                            <li class="breadcrumb-item active" th:text="${notice != null} ? '수정' : '새 글쓰기'">새 글쓰기</li>
                        </ol>

                        <div class="card mb-4">
                            <div class="card-header">
                                <i class="fas fa-pen me-1"></i>
                                <span th:text="${notice != null} ? '글 수정' : '새 글 작성'">새 글 작성</span>
                            </div>
                            <div class="card-body">
                                <form th:action="${notice != null} ? @{'/admin/posts/' + ${notice.postId} + '/edit'} : @{/admin/posts}" method="post" id="noticeForm">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <div class="row g-3 mb-3">
                                        <div class="col-md-8">
                                            <label class="form-label">제목</label>
                                            <input type="text" name="title" class="form-control" placeholder="제목을 입력해주세요." th:value="${notice != null} ? ${notice.title} : ''" required />
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">게시판</label>
                                            <select name="boardType" class="form-select" required>
                                                <option value="" th:selected="${notice == null and #strings.isEmpty(presetBoardType)}" disabled>선택하세요</option>
                                                <option value="공지사항"
                                                        th:selected="${(notice != null and notice.boardType == '공지사항') or (notice == null and presetBoardType == '공지사항')}">공지사항</option>
                                                <option value="이벤트"
                                                        th:selected="${(notice != null and notice.boardType == '이벤트') or (notice == null and presetBoardType == '이벤트')}">이벤트</option>
                                            </select>
                                        </div>
                                    </div>

                                    <label class="form-label">내용</label>
                                    <div class="btn-toolbar mb-2" role="toolbar">
                                        <div class="btn-group btn-group-sm">
                                            <button type="button" class="btn btn-outline-secondary" onmousedown="event.preventDefault();" onclick="document.execCommand('bold')"><strong>B</strong></button>
                                            <button type="button" class="btn btn-outline-secondary" onmousedown="event.preventDefault();" onclick="document.execCommand('italic')"><em>I</em></button>
                                            <button type="button" class="btn btn-outline-secondary" onmousedown="event.preventDefault();" onclick="document.execCommand('underline')"><span style="text-decoration: underline;">U</span></button>
                                        </div>
                                    </div>
                                    <div id="noticeContentEditable" class="form-control mb-3" contenteditable="true"
                                         style="min-height: 220px; white-space: pre-wrap;" th:utext="${notice != null} ? ${notice.description} : ''"></div>
                                    <input type="hidden" name="content" id="noticeContentInput" />

                                    <div class="mb-3">
                                        <label class="form-label">태그 (쉼표로 구분, 선택)</label>
                                        <input type="text" name="tags" class="form-control" placeholder="예: 필독,이벤트" th:value="${notice != null} ? ${notice.tags} : ''" />
                                    </div>

                                    <button type="submit" class="btn btn-primary" th:text="${notice != null} ? '저장' : '등록'">등록</button>
                                    <a th:href="@{/admin/posts}" class="btn btn-outline-secondary">취소</a>
                                </form>
                            </div>
                        </div>
                    </div>
                </main>
                <footer class="py-4 bg-light mt-auto">
                    <div class="container-fluid px-4">
                        <div class="d-flex align-items-center justify-content-between small">
                            <div class="text-muted">Copyright &copy; Roomie</div>
                        </div>
                    </div>
                </footer>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script th:src="@{/startbootstrap-sb-admin-gh-pages/js/scripts.js}"></script>
        <script th:src="@{/admin-search.js}"></script>
        <script>
            document.getElementById('noticeForm').addEventListener('submit', function (e) {
                var editable = document.getElementById('noticeContentEditable');
                var text = editable.textContent.trim();
                if (!text) {
                    e.preventDefault();
                    alert('내용을 입력해주세요.');
                    return;
                }
                document.getElementById('noticeContentInput').value = editable.innerHTML;
            });
        </script>
    </body>
</html>
