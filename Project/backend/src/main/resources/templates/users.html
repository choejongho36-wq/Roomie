<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>회원 관리 - Roomie Admin</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
        <link th:href="@{/startbootstrap-sb-admin-gh-pages/css/styles.css}" rel="stylesheet" />
        <link th:href="@{/admin-custom.css}" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    </head>
    <body class="sb-nav-fixed">
        <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
            <a class="navbar-brand ps-3 admin-brand" th:href="@{/admin}">
                <img th:src="@{/images/roomie-logo.png}" alt="Roomie" class="admin-brand-logo" />
                <span class="admin-brand-text">Roomie<span class="admin-brand-sub">Admin</span></span>
            </a>
            <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle" href="#!"><i class="fas fa-bars"></i></button>
            <form class="d-none d-md-inline-block form-inline ms-auto me-0 me-md-3 my-2 my-md-0">
                <div class="input-group">
                    <input class="form-control" type="text" placeholder="Search for..." aria-label="Search for..." aria-describedby="btnNavbarSearch" />
                    <button class="btn btn-primary" id="btnNavbarSearch" type="button"><i class="fas fa-search"></i></button>
                </div>
            </form>
            <ul class="navbar-nav ms-auto ms-md-0 me-3 me-lg-4">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false"><i class="fas fa-user fa-fw"></i></a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" th:href="@{/admin/logout}">Logout</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
        <div id="layoutSidenav">
            <div id="layoutSidenav_nav">
                <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
                    <div class="sb-sidenav-menu">
                        <div class="nav">
                            <div class="sb-sidenav-menu-heading">Core</div>
                            <a class="nav-link" th:href="@{/admin}">
                                <div class="sb-nav-link-icon"><i class="fas fa-tachometer-alt"></i></div>
                                Dashboard
                            </a>
                            <div class="sb-sidenav-menu-heading">관리</div>
                            <a class="nav-link active" th:href="@{/admin/users}">
                                <div class="sb-nav-link-icon"><i class="fas fa-users"></i></div>
                                회원 관리
                            </a>
                            <a class="nav-link" th:href="@{/admin/posts}">
                                <div class="sb-nav-link-icon"><i class="fas fa-file-alt"></i></div>
                                게시글 관리
                            </a>
                            <a class="nav-link" th:href="@{/admin/inquiries}">
                                <div class="sb-nav-link-icon"><i class="fas fa-envelope-open-text"></i></div>
                                문의 관리
                            </a>
                            <a class="nav-link" th:href="@{/admin/notices}">
                                <div class="sb-nav-link-icon"><i class="fas fa-bullhorn"></i></div>
                                공지/이벤트 관리
                            </a>
                        </div>
                    </div>
                    <div class="sb-sidenav-footer">
                        <div class="small">Logged in as:</div>
                        관리자
                    </div>
                </nav>
            </div>
            <div id="layoutSidenav_content">
                <main>
                    <div class="container-fluid px-4">
                        <h1 class="mt-4">회원 관리</h1>
                        <ol class="breadcrumb mb-4">
                            <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                            <li class="breadcrumb-item active">회원 관리</li>
                        </ol>
                        <div class="card mb-4">
                            <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
                                <span>
                                    <i class="fas fa-users me-1"></i>
                                    전체 회원 (<span th:text="${usersPage.totalElements}">0</span>명)
                                </span>
                                <form th:action="@{/admin/users}" method="get" class="mb-0">
                                    <div class="input-group input-group-sm" style="max-width: 320px;">
                                        <input type="text" name="keyword" class="form-control" placeholder="닉네임 또는 이메일 검색" th:value="${keyword}" />
                                        <button type="submit" class="btn btn-outline-secondary">검색</button>
                                        <a th:if="${!#strings.isEmpty(keyword)}" th:href="@{/admin/users}" class="btn btn-outline-secondary">초기화</a>
                                    </div>
                                </form>
                            </div>
                            <div class="card-body">
                                <table class="table table-striped table-hover align-middle">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>닉네임</th>
                                            <th>이메일</th>
                                            <th>상태</th>
                                            <th>가입일</th>
                                            <th>관리</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="u : ${usersPage.content}">
                                            <td th:text="${u.userId}">1</td>
                                            <td th:text="${u.nickname}">닉네임</td>
                                            <td th:text="${u.email}">email@example.com</td>
                                            <td>
                                                <span class="badge bg-success" th:if="${u.status == 'ACTIVE'}">활성</span>
                                                <span th:if="${u.status == 'SUSPENDED'}">
                                                    <span class="badge bg-warning text-dark">정지</span>
                                                    <div class="small text-muted mt-1">
                                                        <span th:if="${u.suspendedUntil == null}">영구정지</span>
                                                        <span th:if="${u.suspendedUntil != null}" th:text="${#temporals.format(u.suspendedUntil, 'yyyy-MM-dd HH:mm')} + '까지'">2026-01-01까지</span>
                                                    </div>
                                                </span>
                                                <span class="badge bg-secondary" th:if="${u.status == 'WITHDRAWN'}">탈퇴</span>
                                            </td>
                                            <td th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd')}">2026-01-01</td>
                                            <td>
                                                <div th:if="${u.status == 'ACTIVE'}" class="dropdown">
                                                    <button class="btn btn-sm btn-outline-warning dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">정지</button>
                                                    <ul class="dropdown-menu">
                                                        <li>
                                                            <form th:action="@{'/admin/users/' + ${u.userId} + '/suspend'}" method="post">
                                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                                <input type="hidden" name="duration" value="7" />
                                                                <button type="submit" class="dropdown-item" onclick="return confirm('7일간 정지시킬까요?');">7일 정지</button>
                                                            </form>
                                                        </li>
                                                        <li>
                                                            <form th:action="@{'/admin/users/' + ${u.userId} + '/suspend'}" method="post">
                                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                                <input type="hidden" name="duration" value="30" />
                                                                <button type="submit" class="dropdown-item" onclick="return confirm('30일간 정지시킬까요?');">30일 정지</button>
                                                            </form>
                                                        </li>
                                                        <li>
                                                            <form th:action="@{'/admin/users/' + ${u.userId} + '/suspend'}" method="post">
                                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                                <input type="hidden" name="duration" value="PERMANENT" />
                                                                <button type="submit" class="dropdown-item text-danger" onclick="return confirm('영구 정지시킬까요?');">영구정지</button>
                                                            </form>
                                                        </li>
                                                    </ul>
                                                </div>
                                                <form th:if="${u.status == 'SUSPENDED'}" th:action="@{'/admin/users/' + ${u.userId} + '/activate'}" method="post" class="d-inline">
                                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                    <button type="submit" class="btn btn-sm btn-outline-success">활성화</button>
                                                </form>
                                            </td>
                                        </tr>
                                        <tr th:if="${usersPage.empty}">
                                            <td colspan="6" class="text-center text-muted">검색 결과가 없습니다.</td>
                                        </tr>
                                    </tbody>
                                </table>
                                <nav th:if="${usersPage.totalPages > 1}">
                                    <ul class="pagination">
                                        <li class="page-item" th:each="i : ${#numbers.sequence(0, usersPage.totalPages - 1)}"
                                            th:classappend="${i == usersPage.number} ? 'active'">
                                            <a class="page-link" th:href="@{/admin/users(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                    </div>
                </main>
                <footer class="py-4 bg-light mt-auto">
                    <div class="container-fluid px-4">
                        <div class="d-flex align-items-center justify-content-between small">
                            <div class="text-muted">Copyright &copy; Roomie</div>
                        </div>
                    </div>
                </footer>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script th:src="@{/startbootstrap-sb-admin-gh-pages/js/scripts.js}"></script>
    </body>
</html>
