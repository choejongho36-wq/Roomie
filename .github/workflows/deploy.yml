name: Deploy to EC2

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH로 EC2 접속해서 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/Roomie/Project
            echo "==> 최신 코드 받기"
            git pull origin main
            echo "==> 컨테이너 재빌드 및 재기동"
            docker compose up --build -d
            echo "==> 사용하지 않는 이전 이미지 정리 (디스크 부족 방지)"
            docker image prune -f
            echo "==> 배포 완료"
            docker compose ps
